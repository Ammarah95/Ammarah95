<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-labelledby="t">
  <title id="t">Toolbox. UI automation: Playwright (JS and Java), Selenium WebDriver, Nightwatch.js, Katalon Studio. API: REST Assured, Postman, Newman. Performance: Apache JMeter. Frameworks: Cucumber, TestNG, JUnit, Page Object Model. CI and reporting: GitHub Actions, Azure Pipelines, Allure, Extent Reports, LambdaTest. Languages: JavaScript, Java.</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0E2A30"/><stop offset="1" stop-color="#123840"/></linearGradient>
    <clipPath id="c"><rect width="1200" height="300" rx="22"/></clipPath>
    <style>
      .sans { font-family: 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, 'Cascadia Code', 'SF Mono', Menlo, Consolas, monospace; }
      .h { font-size: 17px; font-weight: 600; fill: #E6F0F1; }
      .chip rect { fill: #E6F0F1; fill-opacity: .06; stroke: #E6F0F1; stroke-opacity: .12; }
      .chip text { font-size: 15px; fill: #D9E7E9; }
      .chip.key rect { fill: #45D69A; fill-opacity: .14; stroke: #45D69A; stroke-opacity: .55; }
      .chip.key text { fill: #45D69A; font-weight: 600; }
    </style>
  </defs>
  <g clip-path="url(#c)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect width="8" height="300" fill="#45D69A"/>
  </g>
  <g class="sans">
    <!-- column x positions: 56, 300, 520, 740, 970 -->
    <text x="56" y="62" class="h">UI automation</text>
    <g class="chip key mono"><rect x="56" y="80" width="202" height="34" rx="17"/><text x="75" y="102">Playwright JS/Java</text></g>
    <g class="chip mono"><rect x="56" y="124" width="202" height="34" rx="17"/><text x="75" y="146">Selenium WebDriver</text></g>
    <g class="chip mono"><rect x="56" y="168" width="156" height="34" rx="17"/><text x="75" y="190">Nightwatch.js</text></g>
    <g class="chip mono"><rect x="56" y="212" width="165" height="34" rx="17"/><text x="75" y="234">Katalon Studio</text></g>

    <text x="290" y="62" class="h">API</text>
    <g class="chip key mono"><rect x="290" y="80" width="147" height="34" rx="17"/><text x="309" y="102">REST Assured</text></g>
    <g class="chip mono"><rect x="290" y="124" width="102" height="34" rx="17"/><text x="309" y="146">Postman</text></g>
    <g class="chip mono"><rect x="290" y="168" width="93" height="34" rx="17"/><text x="309" y="190">Newman</text></g>

    <text x="480" y="62" class="h">Performance</text>
    <g class="chip key mono"><rect x="480" y="80" width="93" height="34" rx="17"/><text x="499" y="102">JMeter</text></g>

    <text x="640" y="62" class="h">Frameworks</text>
    <g class="chip mono"><rect x="640" y="80" width="111" height="34" rx="17"/><text x="659" y="102">Cucumber</text></g>
    <g class="chip mono"><rect x="640" y="124" width="93" height="34" rx="17"/><text x="659" y="146">TestNG</text></g>
    <g class="chip mono"><rect x="640" y="168" width="84" height="34" rx="17"/><text x="659" y="190">JUnit</text></g>
    <g class="chip mono"><rect x="640" y="212" width="193" height="34" rx="17"/><text x="659" y="234">Page Object Model</text></g>

    <text x="880" y="62" class="h">CI and reporting</text>
    <g class="chip key mono"><rect x="880" y="80" width="165" height="34" rx="17"/><text x="899" y="102">GitHub Actions</text></g>
    <g class="chip mono"><rect x="880" y="124" width="174" height="34" rx="17"/><text x="899" y="146">Azure Pipelines</text></g>
    <g class="chip mono"><rect x="880" y="168" width="93" height="34" rx="17"/><text x="899" y="190">Allure</text></g>
    <g class="chip mono"><rect x="983" y="168" width="93" height="34" rx="17"/><text x="1002" y="190">Extent</text></g>
    <g class="chip mono"><rect x="880" y="212" width="129" height="34" rx="17"/><text x="899" y="234">LambdaTest</text></g>

    <text x="56" y="278" class="mono" font-size="14" fill="#86A7AE">Languages: JavaScript, Java. Build: npm, Maven. Highlighted chips are what I reach for first.</text>
  </g>
</svg>
