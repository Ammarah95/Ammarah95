<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-labelledby="t d">
  <title id="t">Ammarah Ayubi – Senior QA Automation &amp; Performance Engineer</title>
  <desc id="d">A test run where each line about Ammarah's work passes: automates UI, API and performance tests; builds CI pipelines that publish their own reports; finds defects before customers do.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E2A30"/>
      <stop offset="1" stop-color="#123840"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#E6F0F1" stroke-opacity=".035"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="380" rx="22"/></clipPath>
    <style>
      .sans { font-family: 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, 'Cascadia Code', 'SF Mono', Menlo, Consolas, monospace; }
      .name { font-size: 66px; font-weight: 800; fill: #E6F0F1; letter-spacing: -1.5px; }
      .role { font-size: 23px; font-weight: 500; fill: #BFD6DA; }
      .meta { font-size: 18px; fill: #86A7AE; }
      .cmd  { font-size: 17px; fill: #86A7AE; }
      .cmd b { fill: #E6F0F1; font-weight: 600; }
      .line { font-size: 19px; fill: #D9E7E9; opacity: 0; animation: reveal .35s ease-out forwards; }
      .tick { fill: #45D69A; font-weight: 700; }
      .warn { fill: #F3B23C; font-weight: 700; }
      .ms   { fill: #5F8790; }
      .sum  { font-size: 19px; opacity: 0; animation: reveal .4s ease-out forwards; animation-delay: 3.2s; }
      .pass { fill: #45D69A; font-weight: 700; }
      .def  { fill: #F3B23C; font-weight: 700; }
      .bar  { transform-origin: 676px 0; transform: scaleX(0); animation: grow 2.4s cubic-bezier(.4,.0,.2,1) forwards; animation-delay: .6s; }
      .l1 { animation-delay: .7s; } .l2 { animation-delay: 1.3s; } .l3 { animation-delay: 1.9s; } .l4 { animation-delay: 2.5s; }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes reveal { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
      @keyframes grow { to { transform: scaleX(1); } }
      @keyframes blink { 50% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) {
        .line, .sum { animation: none; opacity: 1; }
        .bar { animation: none; transform: none; }
        .cursor { animation: none; }
      }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="380" fill="url(#bg)"/>
    <rect width="1200" height="380" fill="url(#grid)"/>
    <!-- accent edge: the colour of a passing run -->
    <rect width="8" height="380" fill="#45D69A"/>
  </g>

  <!-- Left: identity -->
  <g class="sans">
    <text x="64" y="150" class="name">Ammarah Ayubi</text>
    <text x="66" y="194" class="role">Senior QA Automation &amp; Performance Engineer</text>
    <text x="66" y="236" class="meta">8+ years in insurance, logistics, fintech and SaaS</text>
    <text x="66" y="264" class="meta">ISTQB® Advanced Test Manager, based in Mumbai</text>
  </g>

  <!-- Right: the test run -->
  <g class="mono">
    <rect x="652" y="52" width="496" height="276" rx="14" fill="#0A2025" fill-opacity=".72" stroke="#E6F0F1" stroke-opacity=".08"/>
    <circle cx="678" cy="76" r="5" fill="#E6F0F1" fill-opacity=".18"/>
    <circle cx="696" cy="76" r="5" fill="#E6F0F1" fill-opacity=".18"/>
    <circle cx="714" cy="76" r="5" fill="#E6F0F1" fill-opacity=".18"/>

    <text x="676" y="118" class="cmd">$ npx playwright test <tspan class="cmd" style="fill:#E6F0F1;font-weight:600">ammarah</tspan><tspan class="cursor" fill="#45D69A">▍</tspan></text>

    <text x="676" y="160" class="line l1"><tspan class="tick">✓</tspan>  automates UI, API &amp; performance <tspan class="ms">1.2s</tspan></text>
    <text x="676" y="192" class="line l2"><tspan class="tick">✓</tspan>  ships CI that reports itself <tspan class="ms">0.9s</tspan></text>
    <text x="676" y="224" class="line l3"><tspan class="tick">✓</tspan>  fixes flaky tests at the root <tspan class="ms">1.4s</tspan></text>
    <text x="676" y="256" class="line l4"><tspan class="warn">!</tspan>  finds bugs before customers do <tspan class="ms">2 found</tspan></text>

    <rect x="676" y="276" width="448" height="4" rx="2" fill="#E6F0F1" fill-opacity=".08"/>
    <g class="bar">
      <rect x="676" y="276" width="404" height="4" rx="2" fill="#45D69A"/>
      <rect x="1080" y="276" width="44" height="4" rx="2" fill="#F3B23C"/>
    </g>
    <text x="676" y="310" class="sum"><tspan class="pass">3 passed</tspan><tspan fill="#86A7AE">, </tspan><tspan class="def">1 known defect</tspan><tspan fill="#5F8790">  in 7.0s</tspan></text>
  </g>
</svg>
